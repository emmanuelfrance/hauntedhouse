<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Touchy Haunted House</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        font: 100%/1.5 sans-serif;
        background: #1a1127;
        color: #fff3df;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      h1 {
        margin-bottom: 8px;
        color: #f5cc7a;
      }

      .instructions {
        margin: 0 0 12px;
        color: #d3c5e2;
      }

      .hud {
        margin: 20px 0 12px;
        color: #ff91b5;
        font: bold 1.2rem/1.5 sans-serif;
      }

      .move-pad {
        margin: 12px 0 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .move-row {
        display: flex;
        gap: 8px;
      }

      .move-btn {
        padding: 10px 16px;
        border: 1px solid #d8b1ed;
        border-radius: 8px;
        background: #493257;
        color: #fff3df;
        cursor: pointer;
        font: inherit;
      }

      .move-btn:hover {
        background: #684579;
      }

      .room {
        position: relative;
        display: flex;
        min-height: 340px;
        align-items: flex-end;
        justify-content: center;
        gap: 34px;
        overflow: hidden;
        padding: 32px 18px 24px;
        border: 4px solid #73518b;
        border-radius: 180px 180px 12px 12px;
        background:
          radial-gradient(ellipse at 50% 100%, #774c72 0 4%, transparent 5%),
          linear-gradient(#29213e 0 75%, #49334e 75%);
        box-shadow: 0 0 45px #a855f755, inset 0 0 35px #100b1b;
      }

      .window {
        position: absolute;
        top: 50px;
        left: 50%;
        display: grid;
        width: 92px;
        height: 112px;
        place-items: center;
        transform: translateX(-50%);
        border: 5px solid #9a78ad;
        border-radius: 50% 50% 4px 4px;
        background: linear-gradient(#18243f, #51426b);
        font-size: 42px;
      }

      .props {
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      .prop {
        z-index: 1;
        width: 132px;
        min-height: 140px;
        border: 2px solid #d8b1ed;
        border-radius: 12px;
        background: #30233e;
        color: #fff3df;
        cursor: pointer;
        font: inherit;
        box-shadow: 0 8px 0 #1b1424;
      }

      .prop img {
        display: block;
        width: 100%;
        height: 92px;
        margin-bottom: 8px;
        border-radius: 7px;
        object-fit: cover;
      }

      .prop:hover { transform: translateY(-4px); background: #493257; }
      .prop:focus-visible { outline: 3px solid #f5cc7a; outline-offset: 4px; }
      .credits { margin-top: 24px; color: #c9bad6; font: .8rem/1.7 sans-serif; }
      .credits a { color: #e3b9ff; }

      .monster {
        position: fixed;
        z-index: 5;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0b0810;
      }

      .monster.pop {
        animation: pop-out 500ms ease-out both;
      }

      .monster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .encounter-next {
        position: absolute;
        z-index: 1;
        bottom: clamp(16px, 4vh, 48px);
        left: 50%;
        transform: translateX(-50%);
        min-width: 140px;
        background: #21142b;
        font-size: 1.25rem;
      }

      .encounter-next:hover {
        transform: translateX(-50%);
      }

      .game-over {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        grid-template-rows: 1fr auto auto;
        justify-items: center;
        align-content: center;
        padding: 24px;
        gap: 12px;
        overflow: hidden;
        background: #100817;
        color: #fff3df;
        text-align: center;
      }

      .game-over-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .game-over h2 {
        z-index: 1;
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        text-shadow: 0 3px 12px #000;
      }

      .game-over .choice {
        z-index: 1;
      }

      .hidden { display: none; }
      #message { min-height: 1.5em; color: #f5cc7a; font-size: 1.15rem; }
      .prop:disabled { cursor: default; opacity: .65; }

      .choice {
        margin: 4px;
        padding: 10px 16px;
        border: 1px solid #d8b1ed;
        border-radius: 8px;
        background: #493257;
        color: #fff3df;
        cursor: pointer;
        font: inherit;
      }

      .choice:hover { background: #684579; }
      .choice:focus-visible { outline: 3px solid #f5cc7a; outline-offset: 3px; }

      @keyframes pop-out {
        from { opacity: 0; transform: scale(.2); }
        to { opacity: 1; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Touchy Haunted House</h1>
      <p class="instructions">You are in the foyer. Touch something to see what happens!</p>
      <p id="hearts" class="hud" aria-label="5 hearts">♥ ♥ ♥ ♥ ♥</p>

      <div class="move-pad" aria-label="Move controls">
        <button class="move-btn" data-direction="up">↑ Up</button>
        <div class="move-row">
          <button class="move-btn" data-direction="left">← Left</button>
          <button class="move-btn" data-direction="down">↓ Down</button>
          <button class="move-btn" data-direction="right">Right →</button>
        </div>
      </div>

      <section class="room" aria-label="A spooky foyer">
        <div class="window" aria-hidden="true">🌙</div>
        <div id="monster" class="monster hidden" role="dialog" aria-label="Animal encounter">
          <img id="monster-image" src="" alt="">
          <button id="next-encounter" class="choice encounter-next hidden" type="button">Next</button>
        </div>
        <div class="props">
          <button class="prop" data-image="images/lion.jpg" data-name="a roaring lion">
            <img src="images/lion.jpg" alt="A lion in a dark jungle" loading="lazy">
            Lion
          </button>
          <button class="prop" data-image="images/wolf.jpg" data-name="a sneaky wolf">
            <img src="images/wolf.jpg" alt="A wolf looking at the camera" loading="lazy">
            Wolf
          </button>
          <button class="prop" data-image="images/gorilla.jpg" data-name="a giant gorilla">
            <img src="images/gorilla.jpg" alt="A gorilla standing in the jungle" loading="lazy">
            Gorilla
          </button>
          <button class="prop" data-image="images/monkey.jpg" data-name="a cheeky monkey">
            <img src="images/monkey.jpg" alt="A monkey on a tree branch" loading="lazy">
            Monkey
          </button>
        </div>
      </section>

      <p id="message" aria-live="polite">Choose an animal to touch. What could be hiding inside?</p>
      <div id="choices" class="hidden">
        <button id="continue" class="choice">Keep exploring</button>
        <button id="run-away" class="choice">Run away!</button>
      </div>
      <button id="restart" class="choice hidden">Play again</button>
      <p class="credits">
        Animal images from the project gallery.
        Clown photo: <a href="https://commons.wikimedia.org/wiki/File:Sad_Clown_-_Occupy_Wall_St.jpg" target="_blank" rel="noreferrer">charliegolonkiewicz (CC BY 2.0)</a>.
      </p>
    </main>
    <div id="game-over" class="game-over hidden" role="alertdialog" aria-labelledby="game-over-title">
      <img class="game-over-image" src="images/clown.jpg" alt="A realistic painted clown face">
      <h2 id="game-over-title">Game over!</h2>
      <button id="play-again" class="choice">Play again</button>
    </div>

    <script>
      const props = document.querySelectorAll(".prop");
      const moveButtons = document.querySelectorAll(".move-btn");
      const message = document.querySelector("#message");
      const monster = document.querySelector("#monster");
      const monsterImage = document.querySelector("#monster-image");
      const nextEncounterButton = document.querySelector("#next-encounter");
      const heartsDisplay = document.querySelector("#hearts");
      const choices = document.querySelector("#choices");
      const continueButton = document.querySelector("#continue");
      const runAwayButton = document.querySelector("#run-away");
      const restartButton = document.querySelector("#restart");
      const instructions = document.querySelector(".instructions");
      const gameOverScreen = document.querySelector("#game-over");
      const playAgainButton = document.querySelector("#play-again");
      const scaryAnimals = [
        { image: "images/creepy-bear.jpg", name: "a creepy bear" },
        { image: "images/lion.jpg", name: "a roaring lion" },
        { image: "images/wolf.jpg", name: "a sneaky wolf" },
        { image: "images/gorilla.jpg", name: "a giant gorilla" },
        { image: "images/monkey.jpg", name: "a strange monkey" }
      ];
      let hearts = 5;
      let gameOver = false;
      let nextEncounterTimer;

      function updateHearts() {
        heartsDisplay.textContent = "♥ ".repeat(Math.max(hearts, 0)).trim();
        heartsDisplay.setAttribute("aria-label", `${hearts} hearts`);
      }

      function updateRoomText(newDirection) {
        const roomNames = {
          up: "the attic",
          down: "the cellar",
          left: "the left hall",
          right: "the right hall",
          foyer: "the foyer"
        };
        instructions.textContent = `You move ${newDirection} and enter ${roomNames[newDirection]}. Touch something to see what happens!`;
      }

      function showMonster(image, description) {
        window.clearTimeout(nextEncounterTimer);
        monsterImage.src = image;
        monsterImage.alt = description;
        nextEncounterButton.classList.add("hidden");
        monster.classList.remove("hidden", "pop");
        void monster.offsetWidth;
        monster.classList.add("pop");
        nextEncounterTimer = window.setTimeout(() => {
          nextEncounterButton.classList.remove("hidden");
          nextEncounterButton.focus();
        }, 3000);
      }

      function closeMonster() {
        window.clearTimeout(nextEncounterTimer);
        monster.classList.add("hidden");
        nextEncounterButton.classList.add("hidden");
      }

      function endGame() {
        gameOver = true;
        closeMonster();
        gameOverScreen.classList.remove("hidden");
        props.forEach((prop) => { prop.disabled = true; });
        moveButtons.forEach((button) => { button.disabled = true; });
        choices.classList.add("hidden");
        restartButton.classList.add("hidden");
        playAgainButton.focus();
      }

      props.forEach((prop) => {
        prop.addEventListener("click", () => {
          if (prop.disabled || gameOver) return;

          showMonster(prop.dataset.image, prop.dataset.name);
          message.textContent = `${prop.dataset.name} jumps out! You lost a heart.`;
          prop.disabled = true;
          prop.dataset.used = "true";
          hearts -= 1;
          updateHearts();
          if (hearts === 0) {
            message.textContent = "The monsters got you!";
            endGame();
            return;
          }

          message.textContent += " What will you do?";
          choices.classList.remove("hidden");
        });
      });

      moveButtons.forEach((button) => {
        button.addEventListener("click", () => {
          if (gameOver) return;

          const directionName = button.dataset.direction;
          updateRoomText(directionName);
          const animal = scaryAnimals[Math.floor(Math.random() * scaryAnimals.length)];
          showMonster(animal.image, animal.name);
          choices.classList.add("hidden");

          if (Math.random() < 0.25) {
            if (hearts < 5) {
              hearts += 1;
              updateHearts();
              message.textContent = `A scary ${animal.name} jumps out, but leaves you a heart!`;
            } else {
              message.textContent = `A scary ${animal.name} jumps out! You found a heart, but your hearts are already full.`;
            }
            return;
          }

          const heartsLost = Math.floor(Math.random() * 3) + 1;
          const actualLoss = Math.min(heartsLost, hearts);
          hearts -= actualLoss;
          updateHearts();

          if (hearts === 0) {
            message.textContent = `A scary ${animal.name} jumps out and takes your last heart!`;
            endGame();
          } else {
            message.textContent = `A scary ${animal.name} jumps out! You lose ${actualLoss} ${actualLoss === 1 ? "heart" : "hearts"}.`;
          }
        });
      });

      nextEncounterButton.addEventListener("click", () => {
        closeMonster();
      });

      window.addEventListener("keydown", (event) => {
        if (gameOver) return;

        const map = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right"
        };

        if (!map[event.key]) return;

        event.preventDefault();
        const targetButton = Array.from(moveButtons).find(
          (button) => button.dataset.direction === map[event.key]
        );

        if (targetButton) {
          targetButton.click();
        }
      });

      continueButton.addEventListener("click", () => {
        if (gameOver) return;

        closeMonster();
        choices.classList.add("hidden");
        props.forEach((item) => {
          if (!item.dataset.used) {
            item.disabled = false;
          }
        });
        message.textContent = "You take a breath. Choose another animal—or move around the house!";
      });

      runAwayButton.addEventListener("click", () => {
        gameOver = true;
        closeMonster();
        message.textContent = "You run out of the haunted house and escape!";
        choices.classList.add("hidden");
        restartButton.classList.remove("hidden");
        moveButtons.forEach((button) => {
          button.disabled = true;
        });
        props.forEach((item) => {
          item.disabled = true;
        });
      });

      restartButton.addEventListener("click", () => {
        window.location.reload();
      });

      playAgainButton.addEventListener("click", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
